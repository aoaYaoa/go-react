name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test Backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
    steps:
      - name: Validate Deploy Secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          if [ -z "${VPS_SSH_KEY_B64:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Missing deploy key secret: set VPS_SSH_KEY_B64 (recommended) or VPS_SSH_KEY."
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_SOURCE="${VPS_SSH_KEY_B64:-$VPS_SSH_KEY}"
          KEY_CONTENT="$(printf '%s' "$KEY_SOURCE" | tr -d '\r')"
          KEY_CONTENT="${KEY_CONTENT%\"}"
          KEY_CONTENT="${KEY_CONTENT#\"}"
          KEY_CONTENT="${KEY_CONTENT%\'}"
          KEY_CONTENT="${KEY_CONTENT#\'}"
          echo "VPS_SSH_KEY length: ${#KEY_CONTENT}"

          if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
            printf '%b' "$KEY_CONTENT" > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$KEY_CONTENT" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

          if grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) ' ~/.ssh/id_ed25519; then
            echo "Invalid VPS_SSH_KEY: looks like a PUBLIC key (.pub)."
            echo "Please set VPS_SSH_KEY to PRIVATE key content."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            B64_CLEAN="$(printf '%s' "$KEY_CONTENT" | tr -d '[:space:]' | tr '_-' '/+')"
            if printf '%s' "$B64_CLEAN" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null; then
              chmod 600 ~/.ssh/id_ed25519
              if grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) ' ~/.ssh/id_ed25519; then
                echo "Invalid VPS_SSH_KEY: looks like base64(PUBLIC key .pub)."
                exit 1
              fi
              if ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
                echo "VPS_SSH_KEY parsed as base64 private key."
              else
                echo "Invalid VPS_SSH_KEY after base64 decode (not a private key)."
                exit 1
              fi
            else
              echo "Invalid VPS_SSH_KEY format."
              echo "Use one of: raw multi-line private key, escaped key with \\n, or base64(private_key)."
              exit 1
            fi
          fi
          HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          USER_INPUT="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '[:space:]')"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "Invalid VPS_PORT='$PORT', fallback to 22"
            PORT=22
          fi
          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_INPUT=$USER_INPUT" >> "$GITHUB_ENV"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH Login
        run: |
          CANDIDATES=("$DEPLOY_USER_INPUT" "ops" "root")
          SELECTED=""
          SEEN=""
          for USER in "${CANDIDATES[@]}"; do
            [ -n "$USER" ] || continue
            case " $SEEN " in
              *" $USER "*) continue ;;
            esac
            SEEN="$SEEN $USER"
            if ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$DEPLOY_HOST" \
              "echo 'SSH login OK as:' && whoami"; then
              SELECTED="$USER"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "SSH login failed for users: $SEEN"
            exit 1
          fi
          echo "DEPLOY_USER=$SELECTED" >> "$GITHUB_ENV"
          echo "Selected deploy user: $SELECTED"

      - name: Trigger Remote Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             SUDO=''
             if [ \"\$(id -u)\" -ne 0 ]; then
               if sudo -n true 2>/dev/null; then
                 SUDO='sudo -n'
               else
                 echo 'Deploy failed: current user cannot run sudo without password.'
                 echo 'Fix: grant NOPASSWD for systemctl/journalctl or use VPS_USER=root.'
                 exit 1
               fi
             fi
             \${SUDO} systemctl start go-react-boot-update.service
             \${SUDO} journalctl -u go-react-boot-update.service -n 120 --no-pager
             curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/health >/dev/null"
