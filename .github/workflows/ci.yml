name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test Backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Validate Deploy Secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_CONTENT="$(printf '%s' "$VPS_SSH_KEY" | tr -d '\r')"
          KEY_CONTENT="${KEY_CONTENT%\"}"
          KEY_CONTENT="${KEY_CONTENT#\"}"
          KEY_CONTENT="${KEY_CONTENT%\'}"
          KEY_CONTENT="${KEY_CONTENT#\'}"

          if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
            printf '%b' "$KEY_CONTENT" > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$KEY_CONTENT" > ~/.ssh/id_ed25519
          fi

          if grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) ' ~/.ssh/id_ed25519; then
            echo "Invalid VPS_SSH_KEY: looks like a PUBLIC key (.pub)."
            echo "Please set VPS_SSH_KEY to PRIVATE key content."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            B64_CLEAN="$(printf '%s' "$KEY_CONTENT" | tr -d '[:space:]' | tr '_-' '/+')"
            if printf '%s' "$B64_CLEAN" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null && \
               ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
              echo "VPS_SSH_KEY parsed as base64 private key."
            else
              echo "Invalid VPS_SSH_KEY format."
              echo "Use one of: raw multi-line private key, escaped key with \\n, or base64(private_key)."
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "Invalid VPS_PORT='$PORT', fallback to 22"
            PORT=22
          fi
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH Login
        run: |
          PORT="${VPS_PORT:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            PORT=22
          fi
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "echo 'SSH login OK as:' && whoami"

      - name: Trigger Remote Deploy
        run: |
          PORT="${VPS_PORT:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            PORT=22
          fi
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             SUDO=''
             if [ \"\$(id -u)\" -ne 0 ]; then
               if sudo -n true 2>/dev/null; then
                 SUDO='sudo -n'
               else
                 echo 'Deploy failed: current user cannot run sudo without password.'
                 echo 'Fix: grant NOPASSWD for systemctl/journalctl or use VPS_USER=root.'
                 exit 1
               fi
             fi
             \${SUDO} systemctl start go-react-boot-update.service
             \${SUDO} journalctl -u go-react-boot-update.service -n 120 --no-pager
             curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/health >/dev/null"
